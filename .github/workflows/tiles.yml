name: Tiles

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

concurrency:
  group: tiles

permissions:
  contents: read
  actions: write

jobs:
  tiles:
    name: Build and publish tiles
    if: github.repository == 'tiducto/planetiler-openmaptiles-extended'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check the Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN secret (see EXTENDED.md for its permissions)."
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: temurin
          cache: maven
      - name: Install tools
        env:
          RCLONE_VERSION: v1.72.1
          RCLONE_SHA256: a385c04469160e28ea37b3c5f6accd15c7f78f819398077c622c7f31e3eec43b
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool jq
          deb="rclone-$RCLONE_VERSION-linux-amd64.deb"
          curl -fsSL -o "$RUNNER_TEMP/$deb" "https://downloads.rclone.org/$RCLONE_VERSION/$deb"
          echo "$RCLONE_SHA256  $RUNNER_TEMP/$deb" | sha256sum -c -
          sudo dpkg -i "$RUNNER_TEMP/$deb"
          rclone version | head -1
      - name: Set up Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          settings="$(scripts/tiles/cloudflare.sh --tiered-cache)"
          echo "::add-mask::$(sed -n 's/^R2_SECRET_ACCESS_KEY=//p' <<<"$settings")"
          echo "$settings" >> "$GITHUB_ENV"
      - name: Build Planetiler
        run: ./mvnw -B -q -DskipTests package
      - name: Prepare work dir
        run: |
          sudo mkdir -p /mnt/tiles
          sudo chown "$USER" /mnt/tiles
          df -h /mnt
      - name: Build tiles
        run: scripts/tiles/build.sh /mnt/tiles
      - name: Publish tiles
        run: scripts/tiles/publish.sh /mnt/tiles
      - name: Keep the schedule enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/tiles.yml/enable"
